<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HP\uc0管理画面</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

.header {
    background: #222;
    color: white;
    padding: 20px 24px;
    font-size: 22px;
    font-weight: bold;
}

.container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 20px;
}

.subtitle {
    margin-bottom: 25px;
    color: #666;
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.menu-card {
    background: white;
    border-radius: 12px;
    padding: 25px;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    transition: 0.2s;
}

.menu-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
}

.icon {
    font-size: 32px;
    margin-bottom: 12px;
}

.menu-title {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 8px;
}

.menu-description {
    color: #777;
    font-size: 14px;
}

.editor {
    display: none;
    background: white;
    border-radius: 12px;
    padding: 30px;
    margin-top: 25px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.editor h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

.buttons {
    margin-top: 25px;
    display: flex;
    gap: 10px;
}

button {
    border: none;
    border-radius: 7px;
    padding: 12px 20px;
    font-size: 15px;
    cursor: pointer;
}

.save {
    background: #222;
    color: white;
}

.back {
    background: #e8e8e8;
    color: #222;
}

.message {
    margin-top: 15px;
    color: #388e3c;
    display: none;
}

@media (max-width: 600px) {
    .menu-grid {
        grid-template-columns: 1fr;
    }

    .container {
        margin-top: 20px;
    }
}
</style>
</head>

<body>

<div class="header">
    HP\uc0管理画面</div>

<div class="container">

    <div id="mainMenu">
        <h1>\uc0管理メニュー</h1>
        <p class="subtitle">\uc0編集したい項目を選択してください。</p>

        <div class="menu-grid">

            <div class="menu-card" onclick="openEditor('top')">
                <div class="icon">\uc0🏠</div>
                <div class="menu-title">\uc0トップページ</div>
                <div class="menu-description">
                    \uc0メインタイトルや紹介文を編集</div>
            </div>

            <div class="menu-card" onclick="openEditor('menu')">
                <div class="icon">\uc0🍛</div>
                <div class="menu-title">\uc0メニュー</div>
                <div class="menu-description">
                    \uc0商品名・価格・説明などを編集</div>
            </div>

            <div class="menu-card" onclick="openEditor('photo')">
                <div class="icon">\uc0🖼️</div>
                <div class="menu-title">\uc0写真</div>
                <div class="menu-description">
                    HP\uc0で使用する写真を管理</div>
            </div>

            <div class="menu-card" onclick="openEditor('news')">
                <div class="icon">\uc0📝</div>
                <div class="menu-title">\uc0お知らせ</div>
                <div class="menu-description">
                    \uc0新着情報やキャンペーンを編集</div>
            </div>

            <div class="menu-card" onclick="openEditor('shop')">
                <div class="icon">\uc0📍</div>
                <div class="menu-title">\uc0店舗情報</div>
                <div class="menu-description">
                    \uc0営業時間・住所・連絡先などを編集</div>
            </div>

        </div>
    </div>


    <div id="editor" class="editor">

        <h2 id="editorTitle">\uc0編集</h2>

        <div id="editorContent"></div>

        <div class="buttons">
            <button class="save" onclick="saveData()">\uc0保存する</button>
            <button class="back" onclick="closeEditor()">\uc0戻る</button>
        </div>

        <div id="message" class="message">
            \uc0保存しました。</div>

    </div>

</div>


<script>

let currentType = "";

function openEditor(type) {

    currentType = type;

    document.getElementById("mainMenu").style.display = "none";
    document.getElementById("editor").style.display = "block";

    const title = document.getElementById("editorTitle");
    const content = document.getElementById("editorContent");

    document.getElementById("message").style.display = "none";

    if (type === "top") {

        title.textContent = "\uc0トップページ編集";

        content.innerHTML = `
            <label>\uc0メインタイトル</label>
            <input id="field1" type="text" placeholder="\uc0例：○○カレー">

            <label>\uc0紹介文</label>
            <textarea id="field2" placeholder="\uc0お店の紹介文を入力してください"></textarea>
        `;

    }

    if (type === "menu") {

        title.textContent = "\uc0メニュー編集";

        content.innerHTML = `
            <label>\uc0商品名</label>
            <input id="field1" type="text" placeholder="\uc0例：気まぐれカレー">

            <label>\uc0価格</label>
            <input id="field2" type="text" placeholder="\uc0例：900円">

            <label>\uc0説明</label>
            <textarea id="field3" placeholder="\uc0商品の説明を入力してください"></textarea>
        `;

    }

    if (type === "photo") {

        title.textContent = "\uc0写真管理";

        content.innerHTML = `
            <label>\uc0写真</label>
            <input id="field1" type="file" accept="image/*">

            <p style="color:#777;">
                \uc0※現在は画面確認用です。次の段階でFirebaseに保存できるようにします。</p>
        `;

    }

    if (type === "news") {

        title.textContent = "\uc0お知らせ編集";

        content.innerHTML = `
            <label>\uc0タイトル</label>
            <input id="field1" type="text" placeholder="\uc0例：新メニューのお知らせ">

            <label>\uc0内容</label>
            <textarea id="field2" placeholder="\uc0お知らせ内容を入力してください"></textarea>
        `;

    }

    if (type === "shop") {

        title.textContent = "\uc0店舗情報編集";

        content.innerHTML = `
            <label>\uc0営業時間</label>
            <input id="field1" type="text" placeholder="\uc0例：11:00〜20:00">

            <label>\uc0住所</label>
            <input id="field2" type="text" placeholder="\uc0住所を入力してください">

            <label>\uc0電話番号</label>
            <input id="field3" type="text" placeholder="\uc0電話番号を入力してください">
        `;
    }
}


function closeEditor() {

    document.getElementById("editor").style.display = "none";
    document.getElementById("mainMenu").style.display = "block";

}


function saveData() {

    document.getElementById("message").style.display = "block";

}

</script>

</body>
</html>
